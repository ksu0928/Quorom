services:
  - type: web
    name: quorum-backend
    env: node
    plan: free
    buildCommand: pnpm install && cd apps/server && pnpm build
    startCommand: cd apps/server && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AI_API_KEY
        sync: false
